{% if include.coming_soon %}
<span class="coming-soon"><span data-lang="zh">即将上架 App Store</span><span data-lang="en">Coming soon to the App Store</span></span>
{% else %}
<a href="https://apps.apple.com/cn/app/id{{ include.id }}" class="download-badge" data-lang="zh">
    <img src="https://tools.applemediaservices.com/api/badges/download-on-the-app-store/black/zh-cn" alt="在 App Store 下载" height="46">
</a>
<a href="https://apps.apple.com/app/id{{ include.id }}" class="download-badge" data-lang="en">
    <img src="https://tools.applemediaservices.com/api/badges/download-on-the-app-store/black/en-us" alt="Download on the App Store" height="46">
</a>
{% endif %}
